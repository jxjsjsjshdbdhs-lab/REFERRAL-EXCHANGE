<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Dashboard</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#0b1220;color:#eef2ff;font-family:Arial}.wrap{max-width:1100px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.card,.tablebox{background:#111b2e;border:1px solid #22304a;border-radius:16px;padding:16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:20px 0}.num{font-size:28px;font-weight:800;margin-top:8px}.muted{color:#94a3b8}button{background:#f97316;color:white;border:0;border-radius:10px;padding:10px 15px;font-weight:bold}table{width:100%;border-collapse:collapse;min-width:750px}th,td{padding:10px;border-bottom:1px solid #22304a;text-align:right;font-size:13px}.tablebox{overflow:auto;margin:12px 0}#error{display:none;background:#4a2028;padding:14px;border-radius:10px}</style></head><body><div class="wrap"><div class="top"><div><h1>🔐 لوحة الإدارة</h1><span class="muted">خاصة بمالك البوت فقط</span></div><button onclick="loadStats()">تحديث</button></div><div id="loading">جارٍ التحقق...</div><div id="error"></div><main id="content" style="display:none"><div class="grid"><div class="card">👥 المستخدمون<div class="num" id="users">0</div></div><div class="card">🆕 مستخدمو اليوم<div class="num" id="today">0</div></div><div class="card">🔗 المهام النشطة<div class="num" id="tasks">0</div></div><div class="card">👀 الزيارات<div class="num" id="visits">0</div></div><div class="card">🤝 الإحالات<div class="num" id="refs">0</div></div></div><h2>المستخدمون</h2><div class="tablebox"><table><thead><tr><th>ID</th><th>Username</th><th>الاسم</th><th>النقاط</th><th>الإحالات</th><th>آخر ظهور</th><th>التسجيل</th></tr></thead><tbody id="usersTable"></tbody></table></div><h2>الروابط والمهام</h2><div class="tablebox"><table><thead><tr><th>ID</th><th>الرابط</th><th>الناشر</th><th>المطلوب</th><th>الزيارات</th><th>المتبقي</th><th>الحالة</th></tr></thead><tbody id="tasksTable"></tbody></table></div></main></div><script>
const URL="https://lquaccwytlxnosjbtdvk.supabase.co/functions/v1/admin-stats";const tg=window.Telegram?.WebApp;if(tg){tg.ready();tg.expand()}function e(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}function d(v){if(!v)return"-";return new Date(v).toLocaleString("ar-IQ")}function fail(x){loading.style.display="none";error.textContent=x;error.style.display="block"}async function loadStats(){error.style.display="none";loading.style.display="block";content.style.display="none";if(!tg?.initData)return fail("افتح هذه الصفحة من داخل Telegram حتى يتم التحقق من حسابك.");try{let r=await fetch(URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({initData:tg.initData})}),j=await r.json();if(!r.ok||j.error)throw Error(j.error||"تعذر تحميل البيانات");let s=j.summary||{};users.textContent=s.users||0;today.textContent=s.today_users||0;tasks.textContent=s.active_tasks||0;visits.textContent=s.total_visits||0;refs.textContent=s.total_referrals||0;usersTable.innerHTML=(j.users||[]).map(u=>`<tr><td>${e(u.telegram_id)}</td><td>${e(u.username?"@"+u.username:"-")}</td><td>${e(u.first_name)}</td><td>${e(u.points)}</td><td>${e(u.referrals_count)}</td><td>${e(d(u.last_seen_at))}</td><td>${e(d(u.created_at))}</td></tr>`).join("");tasksTable.innerHTML=(j.tasks||[]).map(t=>`<tr><td>${e(t.id)}</td><td dir="ltr">${e(t.url)}</td><td>${e(t.owner_username?"@"+t.owner_username:t.owner_id)}</td><td>${e(t.required_visits)}</td><td>${e(t.visits)}</td><td>${Math.max(0,(t.required_visits||0)-(t.visits||0))}</td><td>${t.is_active?"نشطة":"مكتملة"}</td></tr>`).join("");loading.style.display="none";content.style.display="block"}catch(x){fail(x.message)}}loadStats();</script></body></html>
