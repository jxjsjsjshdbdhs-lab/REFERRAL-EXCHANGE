<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم والإدارة الخاصة</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-main: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.9);
            --card-border: rgba(255, 255, 255, 0.15);
            --accent-cyan: #22d3ee;
            --accent-emerald: #34d399;
            --accent-amber: #fbbf24;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --danger-red: #f87171;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(135deg, #0f172a, #1e1b4b);
            background-attachment: fixed;
            color: var(--text-main);
            padding: 16px;
            max-width: 600px;
            margin: 0 auto;
            min-height: 100vh;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--card-border);
        }

        .header h1 {
            font-size: 14pt;
            color: var(--accent-amber);
        }

        .refresh-btn {
            background: var(--accent-cyan);
            color: #0f172a;
            border: none;
            padding: 6px 12px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            font-size: 8.5pt;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 12px;
            text-align: center;
        }

        .stat-val {
            font-size: 16pt;
            font-weight: 800;
            color: var(--accent-cyan);
        }

        .stat-lbl {
            font-size: 8pt;
            color: var(--text-muted);
        }

        .section-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 14px;
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 10pt;
            font-weight: 800;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 8pt;
        }

        .data-table th, .data-table td {
            border: 1px solid var(--card-border);
            padding: 8px 4px;
            text-align: center;
        }

        .data-table th {
            background: rgba(255, 255, 255, 0.05);
            color: var(--accent-cyan);
        }

        .table-container {
            max-height: 250px;
            overflow-y: auto;
        }

        .btn-delete {
            background: rgba(248, 113, 113, 0.2);
            color: var(--danger-red);
            border: 1px solid var(--danger-red);
            padding: 2px 6px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 7.5pt;
        }
    </style>
</head>
<body>

    <!-- Admin Content Container -->
    <div id="admin-content" style="display: none;">
        <div class="header">
            <h1>⚙️ لوحة إدارة البوت الخاصة</h1>
            <button class="refresh-btn" onclick="AdminApp.loadAllData()">تحديث 🔄</button>
        </div>

        <!-- Stats Overview -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-val" id="cnt-users">0</div>
                <div class="stat-lbl">إجمالي الزوار</div>
            </div>
            <div class="stat-card">
                <div class="stat-val" id="cnt-tasks">0</div>
                <div class="stat-lbl">المهمات المنشورة</div>
            </div>
        </div>

        <!-- Users Log -->
        <div class="section-card">
            <div class="section-title" style="color: var(--accent-cyan);">👥 سجل زوار البوت والمستخدمين</div>
            <div class="table-container">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Telegram ID</th>
                            <th>الاسم / اليوزر</th>
                            <th>النقاط</th>
                        </tr>
                    </thead>
                    <tbody id="users-table-body">
                        <tr><td colspan="3">جاري جلب البيانات...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Tasks Log -->
        <div class="section-card">
            <div class="section-title" style="color: var(--accent-emerald);">🔗 سجل المهمات والروابط المنشورة</div>
            <div class="table-container">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>الناشر (ID)</th>
                            <th>الرابط</th>
                            <th>الطلبات</th>
                            <th>إجراء</th>
                        </tr>
                    </thead>
                    <tbody id="tasks-table-body">
                        <tr><td colspan="4">جاري جلب البيانات...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Access Denied Screen -->
    <div id="access-denied" style="display: none; text-align: center; padding: 60px 20px;">
        <h2 style="color: var(--danger-red); margin-bottom: 10px;">⛔ غير مصرح بالدخول</h2>
        <p style="color: var(--text-muted); font-size: 9.5pt;">هذه اللوحة محمية وخاصة بأدمن البوت فقط.</p>
    </div>

    <script>
        const CONFIG = {
            SUPABASE_URL: "https://lquaccwytlxnosjbtdvk.supabase.co",
            SUPABASE_KEY: "sb_publishable_1CuwndQnWV16Lhm7uQ7elw_ym16t_Bi",
            ADMIN_TELEGRAM_ID: 5339335944
        };

        async function dbQuery(endpoint, method = 'GET', body = null) {
            const options = {
                method,
                headers: {
                    apikey: CONFIG.SUPABASE_KEY,
                    Authorization: `Bearer ${CONFIG.SUPABASE_KEY}`,
                    'Content-Type': 'application/json'
                }
            };
            if (body) options.body = JSON.stringify(body);
            
            try {
                const res = await fetch(`${CONFIG.SUPABASE_URL}/rest/v1/${endpoint}`, options);
                return await res.json();
            } catch (err) {
                console.error("API Fetch Error:", err);
                return null;
            }
        }

        const AdminApp = {
            checkAuthorization() {
                const tgUser = window.Telegram?.WebApp?.initDataUnsafe?.user;
                const currentUserId = tgUser?.id;

                if (Number(currentUserId) === Number(CONFIG.ADMIN_TELEGRAM_ID)) {
                    document.getElementById('admin-content').style.display = 'block';
                    document.getElementById('access-denied').style.display = 'none';
                    return true;
                } else {
                    document.getElementById('admin-content').style.display = 'none';
                    document.getElementById('access-denied').style.display = 'block';
                    return false;
                }
            },

            async loadAllData() {
                if (!this.checkAuthorization()) return;
                await this.fetchUsers();
                await this.fetchTasks();
            },

            async fetchUsers() {
                const users = await dbQuery('users?select=*');
                const tbody = document.getElementById('users-table-body');
                
                if (Array.isArray(users) && users.length > 0) {
                    document.getElementById('cnt-users').innerText = users.length;
                    tbody.innerHTML = users.map(u => `
                        <tr>
                            <td><code>${u.telegram_id || 'غير معرّف'}</code></td>
                            <td>${u.first_name || u.username || 'زائر'}</td>
                            <td><strong style="color:var(--accent-amber);">${u.points || 0}</strong></td>
                        </tr>
                    `).join('');
                } else {
                    tbody.innerHTML = `<tr><td colspan="3">لا يوجد مستخدمين بعد.</td></tr>`;
                }
            },

            async fetchTasks() {
                const tasks = await dbQuery('tasks?select=*');
                const tbody = document.getElementById('tasks-table-body');

                if (Array.isArray(tasks) && tasks.length > 0) {
                    document.getElementById('cnt-tasks').innerText = tasks.length;
                    tbody.innerHTML = tasks.map(t => `
                        <tr>
                            <td><code>${t.owner_id}</code></td>
                            <td style="word-break: break-all; max-width: 150px;">
                                <a href="${t.url}" target="_blank" style="color:var(--accent-cyan); text-decoration:none;">${t.url}</a>
                            </td>
                            <td>${t.required_visits || 0}</td>
                            <td>
                                <button class="btn-delete" onclick="AdminApp.deleteTask(${t.id})">حذف</button>
                            </td>
                        </tr>
                    `).join('');
                } else {
                    tbody.innerHTML = `<tr><td colspan="4">لا توجد مهمات منشورة.</td></tr>`;
                }
            },

            async deleteTask(taskId) {
                if (!confirm("هل أنت تأكد من إزالة هذه المهمة من المنصة؟")) return;
                await dbQuery(`tasks?id=eq.${taskId}`, 'DELETE');
                this.fetchTasks();
            }
        };

        document.addEventListener('DOMContentLoaded', () => {
            if (window.Telegram && window.Telegram.WebApp) {
                window.Telegram.WebApp.expand();
            }
            AdminApp.loadAllData();
        });
    </script>
</body>
</html>
