<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exchange App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-start: #0f172a;
            --bg-end: #1e1b4b;
            --card-bg: rgba(30, 41, 59, 0.85);
            --card-border: rgba(255, 255, 255, 0.15);
            --purple: #818cf8;
            --cyan: #22d3ee;
            --emerald: #34d399;
            --amber: #fbbf24;
            --text: #f8fafc;
            --muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }

        body {
            background: linear-gradient(135deg, var(--bg-start), var(--bg-end));
            background-attachment: fixed;
            color: var(--text);
            padding: 16px;
            padding-bottom: 90px;
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
        }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .title { font-size: 20pt; font-weight: 900; color: var(--cyan); }
        .pill { background: rgba(255,255,255,0.1); border: 1px solid var(--card-border); padding: 6px 12px; border-radius: 20px; font-size: 10pt; font-weight: 700; }

        .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 20px; }
        .stat-box { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 14px; padding: 10px; text-align: center; }
        .stat-val { font-size: 14pt; font-weight: 900; color: white; }
        .stat-lbl { font-size: 8pt; color: var(--muted); margin-top: 4px; }

        .banner {
            background: linear-gradient(135deg, rgba(251,191,36,0.2), rgba(245,158,11,0.3));
            border: 1px solid var(--amber); border-radius: 16px; padding: 14px;
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;
        }

        .btn-gold {
            background: linear-gradient(135deg, #fbbf24, #f59e0b); color: #0f172a;
            border: none; border-radius: 10px; padding: 8px 16px; font-weight: 800; cursor: pointer;
        }

        .btn-purple {
            background: linear-gradient(135deg, var(--purple), #6366f1); color: white;
            border: none; border-radius: 12px; padding: 12px; width: 100%; font-size: 11pt; font-weight: 800; cursor: pointer;
        }

        .card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 18px; padding: 16px; margin-bottom: 20px; }
        .card-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .link-box { background: rgba(0,0,0,0.3); border: 1px solid var(--card-border); padding: 10px; border-radius: 10px; font-size: 9pt; color: var(--cyan); margin-bottom: 12px; text-align: left; direction: ltr; word-break: break-all; }

        /* Popups / Modals */
        .modal {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.9);
            display: none; align-items: center; justify-content: center;
            z-index: 999; padding: 16px;
        }

        .modal-content { background: #1e293b; border: 1px solid var(--card-border); border-radius: 20px; padding: 20px; width: 100%; max-width: 380px; }
        .inp { width: 100%; padding: 12px; background: #0f172a; border: 1px solid var(--card-border); border-radius: 10px; color: white; margin: 8px 0 16px 0; outline: none; }

        .nav {
            position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
            width: calc(100% - 32px); max-width: 440px;
            background: rgba(30, 41, 59, 0.95); border: 1px solid var(--card-border);
            border-radius: 20px; display: flex; justify-content: space-around; padding: 10px 0;
        }
        .nav-btn { color: var(--muted); font-size: 8pt; font-weight: 700; text-align: center; cursor: pointer; }
        .nav-btn.active { color: var(--purple); }
    </style>
</head>
<body>

    <div class="header">
        <div class="title">تبادل الإحالات</div>
        <div class="pill">💎 Gram: <span id="gram-bal" style="color:var(--amber);">0.50</span></div>
    </div>

    <div class="stats">
        <div class="stat-box"><div class="stat-val">41.7K</div><div class="stat-lbl">إجمالي النقاط</div></div>
        <div class="stat-box"><div class="stat-val" id="pts-bal" style="color:var(--amber);">10</div><div class="stat-lbl">رصيدك الحالي</div></div>
        <div class="stat-box"><div class="stat-val" id="clicks-count">0</div><div class="stat-lbl">الزيارات المستلمة</div></div>
    </div>

    <div class="banner">
        <div>
            <h4 style="color:var(--amber);">شراء نقاط سريعة ⚡</h4>
            <p style="font-size:8pt; color:var(--muted);">100 نقطة مقابل 0.05 Gram</p>
        </div>
        <button class="btn-gold" id="open-buy-btn">شراء الآن</button>
    </div>

    <div class="card">
        <div class="card-head">
            <span style="font-weight:800;" id="task-user">ناشر الرابط: Muktar</span>
            <span style="font-size:8pt; background:rgba(34,211,238,0.2); color:var(--cyan); padding:4px 8px; border-radius:8px;" id="task-left">متبقي: 6</span>
        </div>
        <div class="link-box" id="task-url">https://t.me/example_bot</div>
        <button class="btn-purple" id="visit-btn">↗ زيارة الرابط (+1 نقطة)</button>
    </div>

    <div class="card">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
            <span style="font-weight:800; font-size:10pt;">رابطك المنشور</span>
            <button style="background:rgba(52,211,153,0.2); color:var(--emerald); border:1px solid var(--emerald); padding:4px 10px; border-radius:8px; font-weight:800; cursor:pointer;" id="open-add-btn">+ نشر رابط جديد</button>
        </div>
        <div id="my-task-info" style="font-size:9pt; color:var(--muted);">لا يوجد رابط مضاف حالياً.</div>
    </div>

    <!-- Modal: Buy Points -->
    <div class="modal" id="buy-modal">
        <div class="modal-content">
            <h3 style="margin-bottom:12px;">شراء النقاط بـ Gram 💎</h3>
            <label style="font-size:9pt; color:var(--muted);">اختر الباقة:</label>
            <select class="inp" id="buy-pkg">
                <option value="100">100 نقطة = 0.05 Gram</option>
                <option value="300">300 نقطة = 0.15 Gram</option>
                <option value="500">500 نقطة = 0.25 Gram</option>
                <option value="1000">1000 نقطة = 0.50 Gram</option>
            </select>
            <div style="display:flex; gap:8px;">
                <button class="btn-gold" style="flex:1;" id="confirm-buy-btn">تأكيد الشراء</button>
                <button class="btn-purple" style="flex:1; background:rgba(255,255,255,0.1);" id="close-buy-btn">إلغاء</button>
            </div>
        </div>
    </div>

    <!-- Modal: Add Link -->
    <div class="modal" id="add-modal">
        <div class="modal-content">
            <h3 style="margin-bottom:12px;">نشر رابط جديد 🔗</h3>
            <label style="font-size:9pt; color:var(--muted);">رابط الإحالة:</label>
            <input type="url" class="inp" id="add-url-inp" placeholder="https://t.me/your_bot">
            <label style="font-size:9pt; color:var(--muted);">عدد الزيارات المطلوب:</label>
            <input type="number" class="inp" id="add-cnt-inp" placeholder="مثال: 10">
            <div style="display:flex; gap:8px;">
                <button class="btn-purple" style="flex:1; background:var(--emerald);" id="confirm-add-btn">نشر</button>
                <button class="btn-purple" style="flex:1; background:rgba(255,255,255,0.1);" id="close-add-btn">إلغاء</button>
            </div>
        </div>
    </div>

    <!-- Navigation -->
    <div class="nav">
        <div class="nav-btn active" id="nav-home">🏠<br>الرئيسية</div>
        <div class="nav-btn" id="nav-store">💎<br>المتجر</div>
        <div class="nav-btn" id="nav-ref">👥<br>الإحالة</div>
    </div>

    <script>
        // Init Telegram WebApp
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.expand();
        }

        // State Variables
        let pts = parseInt(localStorage.getItem('pts')) || 10;
        let gram = parseFloat(localStorage.getItem('gram')) || 0.50;
        let myLink = JSON.parse(localStorage.getItem('myLink')) || null;

        let tasks = [
            { user: "Muktar", left: 6, url: "https://t.me/CryptoAirdropBot" },
            { user: "Ahmed", left: 12, url: "https://t.me/MajorTonBot" }
        ];
        let curTask = 0;

        function refreshUI() {
            document.getElementById('pts-bal').innerText = pts;
            document.getElementById('gram-bal').innerText = gram.toFixed(2);
            
            if(tasks.length > 0) {
                document.getElementById('task-user').innerText = "ناشر الرابط: " + tasks[curTask].user;
                document.getElementById('task-left').innerText = "متبقي: " + tasks[curTask].left;
                document.getElementById('task-url').innerText = tasks[curTask].url;
            }

            let infoBox = document.getElementById('my-task-info');
            if(myLink) {
                infoBox.innerHTML = `<b style="color:var(--cyan);">${myLink.url}</b><br>المتبقي: ${myLink.cnt} زيارة`;
            } else {
                infoBox.innerText = "لا يوجد رابط مضاف حالياً.";
            }
        }

        // Button Events Mapping
        document.getElementById('open-buy-btn').onclick = () => document.getElementById('buy-modal').style.display = 'flex';
        document.getElementById('close-buy-btn').onclick = () => document.getElementById('buy-modal').style.display = 'none';

        document.getElementById('open-add-btn').onclick = () => document.getElementById('add-modal').style.display = 'flex';
        document.getElementById('close-add-btn').onclick = () => document.getElementById('add-modal').style.display = 'none';

        document.getElementById('nav-store').onclick = () => document.getElementById('buy-modal').style.display = 'flex';
        document.getElementById('nav-ref').onclick = () => alert("رابط الإحالة الخاص بك:\nhttps://t.me/YourBot?start=12345");

        // Visit Task Function
        document.getElementById('visit-btn').onclick = () => {
            if(tasks.length === 0) return;
            let t = tasks[curTask];
            window.open(t.url, '_blank');
            pts += 1;
            t.left -= 1;
            localStorage.setItem('pts', pts);
            if(t.left <= 0) tasks.splice(curTask, 1);
            refreshUI();
        };

        // Confirm Buy
        document.getElementById('confirm-buy-btn').onclick = () => {
            let p = parseInt(document.getElementById('buy-pkg').value);
            let cost = (p / 100) * 0.05;
            if(gram < cost) { alert("رصيدك من عملة Gram غير كافٍ!"); return; }
            gram -= cost;
            pts += p;
            localStorage.setItem('gram', gram);
            localStorage.setItem('pts', pts);
            document.getElementById('buy-modal').style.display = 'none';
            refreshUI();
            alert("تم شراء " + p + " نقطة بنجاح!");
        };

        // Confirm Add Link
        document.getElementById('confirm-add-btn').onclick = () => {
            let u = document.getElementById('add-url-inp').value.trim();
            let c = parseInt(document.getElementById('add-cnt-inp').value);
            if(!u || !c || c < 1) { alert("يرجى إدخال الرابط والعدد بشكل صحيح"); return; }
            if(c > pts) { alert("نقاطك لا تكفي! رصيدك: " + pts); return; }
            pts -= c;
            myLink = { url: u, cnt: c };
            localStorage.setItem('pts', pts);
            localStorage.setItem('myLink', JSON.stringify(myLink));
            document.getElementById('add-modal').style.display = 'none';
            refreshUI();
            alert("تم نشر رابطك بنجاح!");
        };

        refreshUI();
    </script>
</body>
</html>
